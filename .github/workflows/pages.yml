# Publishes public/ to GitHub Pages on every push to main.
# Every hour it also checks the official AION 2 announcements and redeploys only when there is a new
# or edited one (otherwise the run stops after the check).
# Each deploy stamps a build id into index.html (so browsers fetch fresh CSS/JS)
# and into version.json (so open pages notice the new version and reload),
# and saves the official AION 2 announcements into public/news/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'   # news check every hour on the hour (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Runs queue instead of cancelling each other, so a news check never stops a deploy of your changes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Pushes and manual runs always deploy. Scheduled runs compare with the news already on the
      # site and only continue when it changed.
      - name: Save official news
        id: news
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 tools/fetch_news.py --check "${{ steps.pages.outputs.base_url }}"
          else
            python3 tools/fetch_news.py
          fi

      - name: Stamp build id
        if: github.event_name != 'schedule' || steps.news.outputs.changed == 'true'
        run: |
          BUILD="${GITHUB_SHA::12}"
          sed -i "s/__BUILD__/${BUILD}/g" public/index.html
          printf '{"build":"%s"}\n' "$BUILD" > public/version.json

      - if: github.event_name != 'schedule' || steps.news.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

      - id: deployment
        if: github.event_name != 'schedule' || steps.news.outputs.changed == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
